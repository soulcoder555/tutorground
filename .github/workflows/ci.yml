name: TutorGround CI

on:
  push:
    branches: ["main", "develop", "codex/**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tutorground
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tutorground?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-secret-with-enough-length
      JWT_REFRESH_SECRET: ci-refresh-secret-with-enough-length
      FRONTEND_URL: http://localhost:3000
      BACKEND_URL: http://localhost:4000
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tutorground/package-lock.json
      - run: npm install
        working-directory: tutorground
      - run: npm run prisma:generate
        working-directory: tutorground
      - run: npm run build --workspace backend
        working-directory: tutorground
      - run: npm run lint --workspace frontend
        working-directory: tutorground
      - run: npm run test --workspace backend
        working-directory: tutorground

